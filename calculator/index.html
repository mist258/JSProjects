<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main class="main">
      <div class="wrapper">
        <form class="form">
          <div>
            <label for="firstNumber">Enter first number:</label>
            <input type="number" id="firstNumber" name="firstNumber" />
          </div>

          <div>
            <label for="secondNumber">Enter second number:</label>
            <input type="number" id="secondNumber" name="secondNumber" />
          </div>

          <div>
            <label for="operator">Enter operator:</label>
            <input type="text" id="operator" name="operator" />
          </div>
        </form>

        <button id="calcBtn">Calculate value</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
