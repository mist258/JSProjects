<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Keyboard Calculator</title>
  </head>
  <body>
    <section class="calculate" id="calculate">
      <div class="display" id="display">
        <header></header>
        <input type="text" name="" id="display_upper" value="" disabled />
        <input type="text" name="" id="display_down" value="0" disabled />
      </div>
      <div class="buttons" id="buttons">
        <button type="button" class="buttonNumber" id="one">1</button>
        <button type="button" class="buttonNumber" id="two">2</button>
        <button type="button" class="buttonNumber" id="three">3</button>
        <button type="button" class="buttonNumber" id="four">4</button>
        <button type="button" class="buttonNumber" id="five">5</button>
        <button type="button" class="buttonNumber" id="six">6</button>
        <button type="button" class="buttonNumber" id="seven">7</button>
        <button type="button" class="buttonNumber" id="eight">8</button>
        <button type="button" class="buttonNumber" id="nine">9</button>
        <button type="button" class="buttonNumber" id="zero">0</button>
        <button type="button" class="buttonNumber" id="dot">.</button>

        <button type="button" class="buttonOper" id="percent">%</button>
        <button type="button" class="buttonOper" id="plus">+</button>
        <button type="button" class="buttonOper" id="minus">-</button>
        <button type="button" class="buttonOper" id="mult">×</button>
        <button type="button" class="buttonOper" id="div">÷</button>

        <button type="button" class="buttonSpecial" id="clears">AC</button>
        <button type="button" class="buttonSpecial" id="clear">C</button>
        <button type="button" class="buttonOper" id="equal">=</button>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
